<h1 class="text-2xl font-bold">Listado de Productos</h1>
<h3 class="text-lg">
  Total de productos
  <span class="text-accent">{{ productsResource.value()?.count }}</span>
</h3>
<div class="divider"></div>

<div class="flex flex-row gap-10 items-center h-20">
  <pagination
    [pages]="productsResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  />

  <select
    class="select select-bordered w-32"
    (change)="productsPerPage.set(+selectedPerPage.value)"
    #selectedPerPage
  >
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="30">30</option>
    <option value="40">40</option>
  </select>
</div>

<product-table [products]="productsResource.value()?.products ?? []" />
